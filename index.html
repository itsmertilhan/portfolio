  </header><main><h1>Mert İlhan (Mert Ilhan) — Software Developer</h1>
      <p>
        Mert İlhan (Mert Ilhan) is a Software Developer from Tekirdağ, Turkey and a student at
        <strong>42 Kocaeli</strong>. Systems programming in C and C++, plus AI and data projects in Python.
      </p>
      <section>
        <h2>Software Engineering, Systems &amp; AI Projects</h2>
        <ul>
        <li><a href="/project/Google-Bootcamp-Mediscan-AI">MediScan AI</a> — AI powered health platform that recognises medicine from a photo of its box, blister or the pill itself, then rewrites the official leaflet in language anyone can understand.</li>
        <li><a href="/project/portfolio">This Portfolio</a> — The site you are reading. A React single page app deployed to GitHub Pages, with a projects section that reads its own statistics and documentation from the GitHub API at runtime.</li>
        <li><a href="/project/salifort-retention">Employee Retention Model</a> — Capstone of the Google Advanced Data Analytics certificate: predicting which employees are about to leave a company, and identifying what is actually driving them out.</li>
        <li><a href="/project/born2beroot">Born2beroot</a> — A hardened Debian server built from a blank virtual machine: encrypted LVM partitions, a strict sudo and password policy, a firewall, a scheduled monitoring script — and, for the bonus, a WordPress site served by lighttpd and MariaDB.</li>
        <li><a href="/project/netpractice">NetPractice</a> — A networking exercise: repair ten broken TCP/IP topologies by working out the addressing, masks and routes each one needs.</li>
        <li><a href="/project/cpp09">CPP Module 09</a> — The last C++ module: choosing the right STL container for each problem and paying for that choice in performance.</li>
        <li><a href="/project/transcendence">ft_transcendence</a> — The final project of the common core: a real time multiplayer Pong website with accounts, chat and matchmaking.</li>
        <li><a href="/project/Web_serv-std98-">Webserv</a> — A non blocking HTTP/1.1 server written from scratch in C++98. Parses its own nginx style config, serves static files, handles CGI and keeps many clients alive on a single event loop.</li>
        <li><a href="/project/CPP05-09">CPP Modules 05-08</a> — The advanced half of the 42 C++ track: exception hierarchies, type casting and serialisation, templates, and finally container and iterator work on top of the STL.</li>
        <li><a href="/project/Inception">Inception</a> — A small infrastructure built entirely from hand written Dockerfiles: NGINX with TLS, WordPress on PHP-FPM and MariaDB, wired together with docker-compose and persistent volumes.</li>
        <li><a href="/project/MiniRT">miniRT</a> — A ray tracer in C. Parses a scene description, then renders spheres, planes and cylinders with ambient and diffuse lighting, hard shadows and 2×2 supersampling.</li>
        <li><a href="/project/minishell">minishell</a> — A working shell in C. Lexer and parser for quotes, redirections and pipes, plus its own builtins, environment handling and signal behaviour that matches bash.</li>
        <li><a href="/project/philo">Philosophers</a> — The dining philosophers problem solved with threads and mutexes. No philosopher starves and no data race survives, which is the entire difficulty of the exercise.</li>
        <li><a href="/project/push_swap">push_swap</a> — Sorting a stack with a restricted instruction set, using a radix sort to keep the instruction count low. Graded purely on how short the output sequence is.</li>
        <li><a href="/project/fractol">fract-ol</a> — Real time fractal explorer built on MiniLibX, rendering the Mandelbrot and Julia sets with interactive zoom deep into the boundary.</li>
        <li><a href="/project/minitalk">minitalk</a> — A client and server that exchange whole strings using nothing but the two UNIX user signals, encoding each character one bit at a time.</li>
        <li><a href="/project/get_next_line">get_next_line</a> — Reads one line at a time from any file descriptor, keeping the leftover bytes in a static buffer between calls so nothing is read twice or lost.</li>
        <li><a href="/project/ft_printf">ft_printf</a> — A reimplementation of printf with variadic arguments, handling the conversion specifiers of the original and returning the same character count.</li>
        <li><a href="/project/libft">libft</a> — The first project of the cursus: a static library rebuilding the parts of the C standard library that every later project depends on.</li>
      </ul>
