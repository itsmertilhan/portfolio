  </header><main><h1>42 Kocaeli Deneyimim ve WURI Dünya 3.&#39;lüğü: Akran Öğrenmesiyle Sistem Programlama</h1>
      <p><strong>EN:</strong> Peer-to-Peer Systems Engineering at 42 Kocaeli (WURI #3 Worldwide)</p>
      <p>Öğretmensiz, ders kitapsız ve hazır kütüphanesiz bir mühendislik okulunda C ve C++ ile sıfırdan yazılım inşa etmek.</p>
      <p>What building software from scratch in C and C++—without teachers, textbooks, or standard libraries—teaches about engineering discipline.</p>
      <section><h2>Standart Kütüphaneyi Kendi Elinle Yazmadan Kullanamamak: libft ile Başlangıç</h2><p>42 Kocaeli müfredatının (Common Core) ilk kuralı basittir: kendi yazmadığın bir fonksiyonu çağrı yığınında göremezsin. İlk proje olan libft&#39;te memset, memcpy, strlcpy, split ve calloc gibi 34 temel C fonksiyonunu sıfırdan yazıp ar ile statik bir libft.a arşivine derlersin. Sonraki aylarda geliştireceğin her proje bu kütüphaneye bağlanır.</p><p>Bu yaklaşım soyutlamaları erken aşamada ortadan kaldırır. Bir string bölme fonksiyonunda (ft_split) yedinci kelimenin bellek tahsisi başarısız olduğunda önceki altı tahsisi tek tek serbest bırakmadan çıkamayacağını ilk haftadan öğrenirsin. Valgrind raporu temiz değilse proje geçmez; tek bir bayt bellek sızıntısı (memory leak) bile değerlendirmeyi sıfırlar.</p><p><strong>Not:</strong> Hazır soyutlamaları kullanmadan önce onları sıfırdan inşa etmek, bellek düzenini ve hata yollarını sezgisel hale getirir.</p></section>
      <section><h2>Akran Değerlendirmesi (Peer-Evaluation): Kodunu Savunabiliyorsan Senindir</h2><p>42 ekosisteminde öğretmen veya ders saati yoktur. Yazdığın her projeyi otomatik test sürecinden (Moulinette) önce kampüsteki üç farklı öğrenciye satır satır açıklamak ve savunmak zorundasın. Karşındaki akranın senden farklı bir mimari kurmuş olması, her değerlendirmeyi gerçek bir tasarım incelemesine (code review) dönüştürür.</p><p>WURI (World&#39;s Universities with Real Impact) 2025 ve 2026 sıralamalarında 42 ağının küresel inovasyonda dünya 3.&#39;sü seçilmesinin arkasındaki temel dinamik budur: ezberlenmiş müfredat yerine, belirsizlik altında dökümantasyon okuyup çalışan sistem üreten ve ürettiği kodu akranlarına savunabilen mühendisler yetiştirmek.</p><p><strong>Not:</strong> Açıklayamadığın kod sana ait değildir; akran değerlendirmesi her teslimi canlı bir teknik mülakata çevirir.</p></section>
      <section><h2>UNIX Süreçleri, Sinyaller ve Eşzamanlılık: minishell ve Philosophers</h2><p>Müfredat ilerledikçe tek süreçli algoritmalardan işletim sistemi sınırlarına geçilir. minishell projesinde bash davranışını birebir taklit eden bir kabuk yazılır: tırnak kurallarına duyarlı sözcük çözümleyici (lexer), ardışık boru hatları (pipe), dosya yönlendirmeleri (redirection) ve etkileşimli mod ile alt süreç modu arasında değişen SIGINT/SIGQUIT sinyal yöneticileri.</p><p>Hemen ardından gelen Philosophers (philo) ise yemek yiyen filozoflar problemini POSIX iş parçacıkları (pthread) ve mutex kilitleriyle çözdürür. Hiçbir filozofun açlıktan ölmemesi ve tek bir veri yarışının (data race) bile yaşanmaması için zamanlayıcı hassasiyeti ile kilit sıralamasını mikrosaniye düzeyinde kurgulamak gerekir.</p><p><strong>Not:</strong> Süreç çatallama (fork/execve) ve mutex senkronizasyonu, işletim sisteminin perde arkasında ne yaptığını görünür kılar.</p></section>
      <section><h2>Bireysel Disiplinden Takım Ürününe: ft_transcendence</h2><p>Common Core&#39;un final halkası olan ft_transcendence, bir egzersizden çok gerçek zamanlı bir web ürünüdür. OAuth kimlik doğrulaması, iki faktörlü güvenlik, moderasyonlu sohbet kanalları ve WebSocket üzerinden sunucu-otoriteli çok oyunculu Pong simülasyonu tek bir docker-compose çağrısıyla ayağa kalkar.</p><p>C ile sıfırdan bellek yöneterek başlayan yolculuk, burada konteyner mimarisi, ağ gecikmesi telafisi (client-side interpolation) ve takım içi arayüz sözleşmeleriyle birleşir. 42 Kocaeli&#39;nin bana kazandırdığı en güçlü refleks, dil veya katman değişse de problemi en alt ilkelerine (first principles) indirerek çözmektir.</p></section>
      <hr />
      <section><h2>Earned Abstractions: Rebuilding libc in libft Before Using It</h2><p>The opening rule of the 42 common core is disarmingly strict: if you did not write a function yourself, you cannot call it. In the very first project, libft, you reimplement 34 foundational C library routines—memset, memcpy, strlcpy, split, calloc, and file-descriptor writers—and archive them into libft.a. Every subsequent project links against the library you built with your own hands.</p><p>That constraint strips away magical thinking early. When writing ft_split, you immediately confront what happens if the seventh allocation in an array of strings fails: you must unwind the previous six allocations cleanly before returning NULL. A single leaked byte under Valgrind fails the entire evaluation.</p></section>
      <section><h2>Why Peer Evaluation Scales Engineering Judgment (WURI #3 Worldwide)</h2><p>There are no lectures or professors at 42 Kocaeli. Before automated grading ever touches your repository, you sit down with three different peers on campus and defend every design decision line by line. Because your evaluator solved the same problem differently two weeks ago, every defense becomes a rigorous architecture review.</p><p>This peer-to-peer model is a major reason 42 was ranked the 3rd most innovative institution in the world in the 2025 and 2026 WURI rankings. Instead of optimizing for exams, it trains engineers to read manual pages, reason from specifications, and communicate technical trade-offs clearly.</p></section>
      <section><h2>Processes, Signals, and Concurrency: minishell and Philosophers</h2><p>Midway through the curriculum, algorithmic exercises give way to operating-system mechanics. In minishell, you build a working UNIX shell in C complete with quote-aware lexical analysis, multi-stage pipelines, file-descriptor redirections, environment expansion, and signal handlers that behave differently depending on whether a child process is foregrounded.</p><p>Philosophers (philo) then shifts the challenge to shared-memory concurrency using POSIX threads and mutexes. Keeping every philosopher alive while guaranteeing zero data races under thread sanitizers forces you to reason carefully about lock granularity and scheduling jitter.</p></section>
      <section><h2>From Low-Level Primitives to Full-Stack Systems: ft_transcendence</h2><p>The common core culminates in ft_transcendence, a real-time multiplayer Pong platform with 42 OAuth sign-in, two-factor authentication, moderated chat channels, live spectating, and a server-authoritative physics loop orchestrated across Docker containers.</p><p>Starting from raw pointers in C and finishing with distributed real-time state over WebSockets creates a durable engineering habit: regardless of the stack, break the problem down to its invariants, own the failure modes, and keep the interfaces clean.</p></section>
