  </header><main><h1>MediScan AI: Bilgisayarlı Görü ve LLM ile İlaç Prospektüsü Analizi</h1>
      <p><strong>EN:</strong> MediScan AI: Computer Vision &amp; LLMs for Accessible Healthcare</p>
      <p>İlaç kutusu, blister veya hap fotoğrafından ilacı tanıyan ve karmaşık tıbbi prospektüsleri herkesin anlayabileceği güvenilir bir dile çeviren yapay zeka boru hattı.</p>
      <p>Identifying medication from a photo of its box, blister pack, or pill—and translating dense clinical leaflets into clear, grounded patient guidance.</p>
      <section><h2>Problem: Okunması Güç Prospektüsler ve Kutusu Kaybolmuş İlaçlar</h2><p>Günlük hayatta özellikle yaşlı hastalar veya çoklu ilaç kullanan bireyler iki temel sorunla karşılaşır: dış kutusu atılmış bir blister veya tek bir haptan ilacın ne olduğunu hatırlayamamak ve katlanmış prospektüsteki ağır farmakolojik terimler arasında kritik uyarıları gözden kaçırmak.</p><p>Google Bootcamp kapsamında geliştirdiğimiz MediScan AI, bu iki adımı tek bir akışta birleştirir: görselden ilacı yüksek doğrulukla teşhis etmek ve yalnızca doğrulanmış resmi prospektüs metnini kaynak alarak sade, anlaşılır bir kullanım rehberi sunmak.</p><p><strong>Not:</strong> Sağlık odaklı yapay zeka uygulamalarında hız kadar önemli olan şey, modelin serbest tahmin yerine doğrulanmış tıbbi metne bağlı kalmasıdır.</p></section>
      <section><h2>Çok Aşamalı Görsel Tanıma: Kutu, Blister ve Hap Öznitelikleri</h2><p>Tek bir ilaç fotoğrafı üç farklı formda gelebilir: tipografik bilginin yoğun olduğu karton kutu, parlak alüminyum yansımalı blister ambalaj veya yalnızca renk, şekil ve baskı kodu (imprint) taşıyan tekil hap.</p><p>Görüntü işleme katmanı önce ön işleme (kontrast dengeleme, perspektif ve parlama azaltma) uygular; ardından görsel sınıflandırma ve optik karakter/baskı okuma sinyallerini birleştirerek ilacın etken maddesini ve ticari formunu resmi veri tabanındaki kayıtla eşleştirir.</p><p><strong>Not:</strong> Görsel sınıflandırmayı metin ve baskı kodu (imprint) ipuçlarıyla birleştirmek, benzer görünümlü ilaçlar arasındaki belirsizliği ortadan kaldırır.</p></section>
      <section><h2>Halüsinasyonsuz LLM Sadeleştirmesi: Kaynak Metne Bağlı Özetleme</h2><p>Bir Büyük Dil Modeline (LLM) doğrudan &#39;Bu ilaç ne işe yarar?&#39; diye sormak tıbbi açıdan tehlikelidir; model dozaj veya etkileşim bilgisini uydurabilir (hallucination). MediScan AI&#39;da LLM bir bilgi kaynağı olarak değil, kontrollü bir çevirmen olarak konumlandırılır.</p><p>Tanınan ilacın resmi prospektüsü sisteme bağlam (context) olarak verilir ve modelden yalnızca bu metindeki bilgileri kullanarak &#39;Ne için kullanılır?&#39;, &#39;Nasıl alınmalı?&#39;, &#39;Kimler dikkat etmeli?&#39; ve &#39;Olası yan etkiler&#39; başlıklarını sade bir dille yapılandırması istenir. Böylece tıbbi doğruluk korunurken okunabilirlik herkes için erişilebilir hale gelir.</p><p><strong>Not:</strong> LLM&#39;i açık uçlu bir bilgi tabanı yerine doğrulanmış prospektüs metnini sadeleştiren bir katman olarak sınırlamak, halüsinasyon riskini keser.</p></section>
      <hr />
      <section><h2>The Real-World Problem: Loose Blister Packs and Unreadable Leaflets</h2><p>Patients managing multiple prescriptions routinely face two practical hazards: identifying a loose blister strip or individual pill after its cardboard box is gone, and deciphering dense pharmacological jargon inside folded package inserts.</p><p>Built during the Google Bootcamp, MediScan AI bridges both gaps in a single workflow—recognizing the medication from a camera snapshot and rewriting its official leaflet into structured, plain-language guidance.</p></section>
      <section><h2>Multi-Modal Visual Recognition Across Boxes, Blisters, and Pills</h2><p>Real user photos vary wildly: a carton rich in typography, a reflective foil blister pack, or a single tablet defined only by shape, color, score line, and imprint code.</p><p>The vision pipeline normalizes lighting and glare, extracts both visual embeddings and typographical/imprint cues, and resolves the candidate against verified medication records before any explanation is generated.</p></section>
      <section><h2>Preventing Medical Hallucinations via Context-Grounded LLMs</h2><p>Asking an ungrounded language model for dosage or contraindication advice is unsafe. In MediScan AI, the LLM is never asked to recall medical facts from parametric memory; instead, it operates strictly as a plain-language translator over the retrieved official leaflet.</p><p>By constraining generation to the verified source document and structuring the output into clear sections—purpose, usage instructions, warnings, and side effects—patients get accessible explanations without sacrificing clinical accuracy.</p></section>
