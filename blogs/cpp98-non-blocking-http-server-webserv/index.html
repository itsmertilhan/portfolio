  </header><main><h1>C++98 ile Non-Blocking HTTP/1.1 Sunucusu: Tek Event Loop ile Webserv</h1>
      <p><strong>EN:</strong> Building a Non-Blocking HTTP/1.1 Server in C++98 (Webserv)</p>
      <p>İş parçacığı kullanmadan tek bir I/O çoğullama döngüsü üzerinde binlerce bağlantıyı, parçalı (chunked) aktarımları ve CGI süreçlerini yönetmek.</p>
      <p>Multiplexing persistent connections, chunked transfer encoding, and asynchronous CGI pipes on a single event loop in C++98.</p>
      <section><h2>Neden Tek Bir Event Loop? Bloklayan I/O&#39;nun Maliyeti</h2><p>Ağ programlamaya yeni başlayanların ilk refleksi her istemci bağlantısı için ayrı bir iş parçacığı (thread) açmak veya recv() çağrısının veri gelene kadar beklemesine izin vermektir. Ancak yavaş bir istemci (veya yarım bırakılmış bir HTTP başlığı) bloklayan bir sunucuyu tek başına kilitleyebilir.</p><p>Webserv projesinin temel kısıtı nettir: tüm soketler non-blocking (O_NONBLOCK) modda çalışmalı ve sunucu içindeki her okuma/yazma işlemi tek bir poll()/epoll() olay döngüsünden (event loop) geçmelidir. Hazır olmayan bir dosya tanıtıcısından (file descriptor) okuma yapmak yasaktır.</p><p><strong>Not:</strong> Tek bir olay döngüsüyle yüzlerce istemciyi beslemek için her bağlantıyı durum makinesi (state machine) olarak modellemek gerekir.</p></section>
      <section><h2>Parçalı Gelen İstekler ve Durumlu HTTP/1.1 Ayrıştırıcısı</h2><p>TCP mesaj tabanlı değil, bayt akışı (byte stream) tabanlı bir protokoldür. Bir HTTP isteği tek bir recv() çağrısında tam gelebileceği gibi, başlıkların ortasından bölünmüş beş ayrı paket halinde veya Transfer-Encoding: chunked gövdesiyle parça parça da gelebilir.</p><p>Bu nedenle her istemci nesnesi kendi okuma tamponunu ve ayrıştırma durumunu (istek satırı, başlıklar, chunk boyutu, gövde baytları, tamamlandı) tutar. Olay döngüsü yeni baytlar geldiğinde ayrıştırıcıyı kaldığı yerden ilerletir; istek tamamlandığında ise sanal sunucu (server_name) ve konum (location) kurallarına göre yönlendirme yapar.</p><p><strong>Not:</strong> TCP paket sınırlarını garanti etmez; sağlam bir HTTP ayrıştırıcısı kısmi okumalar arasında durumunu korumalıdır.</p></section>
      <section><h2>Nginx Tarzı Konfigürasyon ve Dinamik CGI Boru Hatları</h2><p>Sunucu başlangıçta kendi nginx benzeri yapılandırma dosyasını ayrıştırır: dinlenecek portlar, sanal ana bilgisayarlar, özel hata sayfaları, istemci gövde boyutu sınırları (client_max_body_size), izin verilen HTTP metotları (GET, POST, DELETE), dizin listeleme (autoindex) ve CGI uzantıları.</p><p>Dinamik içerik gerektiğinde sunucu ortam değişkenlerini (PATH_INFO, QUERY_STRING, CONTENT_LENGTH) hazırlayıp fork/execve ile ilgili CGI betiğini başlatır. Kritik nokta şudur: CGI sürecine giden ve ondan dönen borular (pipe) da ana olay döngüsüne kaydedilir; böylece yavaş çalışan bir Python veya PHP betiği bile diğer istemcilerin statik dosya indirmesini tek milisaniye dahi bloklamaz.</p><p><strong>Not:</strong> CGI borularını da ana poll/epoll döngüsüne dahil etmek, alt süreçlerin sunucuyu dondurmasını engeller.</p></section>
      <hr />
      <section><h2>Why a Single Event Loop? Avoiding Blocking I/O Pitfalls</h2><p>A naive TCP server blocks on recv() waiting for a client to finish sending headers, allowing a single slow or stalled connection to starve everyone else. Webserv enforces a strict systems rule: every socket and pipe must be non-blocking, and all I/O readiness must be driven by a single poll()/epoll() event loop.</p><p>Because no read or write call is ever allowed to block, every connected client is modeled as an explicit state machine: reading request headers, streaming a chunked body, waiting on a CGI child pipe, or draining the response buffer.</p></section>
      <section><h2> incremental HTTP/1.1 Parsing and Chunked Transfer Encoding</h2><p>TCP delivers an unstructured byte stream, not discrete messages. A single HTTP request might arrive split across four small socket reads, or a large upload may use Transfer-Encoding: chunked where payload length is only known chunk by chunk.</p><p>Each client connection accumulates incoming bytes and advances an incremental parser through request-line validation, header normalization, and chunked body reassembly before matching the request against virtual-host and route location blocks.</p></section>
      <section><h2>Nginx-Style Configuration and Non-Blocking CGI Execution</h2><p>On startup, Webserv parses its own nginx-inspired configuration grammar: multiple listening ports, hostnames, custom error pages, client_max_body_size limits, allowed methods (GET, POST, DELETE), directory auto-indexing, and HTTP redirects.</p><p>When a route targets a CGI script, the server sets up standard CGI environment variables, spawns the interpreter via fork/execve, and registers the child&#39;s stdin/stdout pipes directly into the main event loop—ensuring a slow script never stalls static file delivery for other clients.</p></section>
