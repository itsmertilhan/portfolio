  </header><main><h1>C ile Sıfırdan Ray Tracer Geliştirmek: miniRT Mimarisi ve Tarayıcı Portu</h1>
      <p><strong>EN:</strong> Writing a Ray Tracer from Scratch in C: Inside miniRT</p>
      <p>Sahne ayrıştırıcıdan küre/silindir kesişim matematiğine, sert gölgelerden 2x2 supersampling ve JavaScript Canvas portuna uzanan yolculuk.</p>
      <p>From .rt scene parsing and finite-cylinder intersection math to hard shadows, 2x2 supersampling, and a browser-native JavaScript port.</p>
      <section><h2>Her Piksel İçin Bir Işın: Kamera Uzayından Dünya Koordinatlarına</h2><p>Bir ray tracer&#39;ın temel fikri, gerçek dünyadaki foton yolculuğunu tersine çevirmektir: ışık kaynağından çıkan milyonlarca fotonu takip etmek yerine, kameranın gözünden (origin) görüntü düzlemindeki her pikselin içinden geçen bir ışın P(t) = O + t·D gönderilir.</p><p>miniRT&#39;de sahne tanımı bir .rt dosyasından okunur: kamera konumu, yönelim vektörü, görüş açısı (FOV), ortam ışığı (ambient), noktasal ışık kaynağı ve geometrik nesneler. Ayrıştırıcı (parser) eksik veya sınır dışı tek bir parametre gördüğünde belleği temizleyip anlamlı bir hata mesajıyla çıkar.</p><p><strong>Not:</strong> Görselleştirme boru hattının sağlamlığı, daha ilk ışın atılmadan önce sahne verisinin deterministik biçimde doğrulanmasıyla başlar.</p></section>
      <section><h2>Analitik Kesişimler: Küre, Düzlem ve Sonlu Silindir Matematiği</h2><p>Küre ve düzlem kesişimleri analitik olarak doğrudan çözülür: küre için ışın denklemi |O + tD - C|² = r² içine yerleştirildiğinde ikinci dereceden bir denklem (at² + bt + c = 0) elde edilir ve diskriminantın pozitif en küçük kökü en yakın yüzeyi verir.</p><p>Asıl mühendislik sınavı sonlu silindirdir. Sonsuz silindir yan yüzeyi için ışın ve merkez eksene dik bileşenler üzerinden kuadratik denklem çözülür; bulunan t değerinin silindir ekseni üzerindeki izdüşümü [0, height] aralığında mı diye kontrol edilir. Ardından alt ve üst kapak düzlemleriyle disk kesişimleri hesaplanır ve her nokta için doğru yüzey normali (yan yüzeyde radyal, kapaklarda eksenel) üretilir.</p><p><strong>Not:</strong> Sonlu silindir kesişimi, yan gövde kuadratik çözümü ile alt/üst kapak düzlem kesişimlerinin hatasız birleşimini gerektirir.</p></section>
      <section><h2>Lambertian Aydınlatma, Sert Gölgeler ve 2x2 Supersampling</h2><p>En yakın kesişim noktası P ve birim yüzey normali N bulunduğunda, renk iki bileşenden oluşur: ortam ışığı (ambient) ve yüzey normali ile ışık yönü L arasındaki açının kosinüsüyle (max(0, N·L)) ölçeklenen difüz (Lambertian) yansıma.</p><p>Gölge testi için kesişim noktasından ışık kaynağına doğru epsilon kadar kaydırılmış (self-intersection&#39;ı önlemek için P + εN) bir gölge ışını gönderilir. Işık mesafesinden daha yakın bir nesne varsa difüz katkı kesilir. Kenar tırtıklanmasını (aliasing) yumuşatmak için ise her piksel 2x2 alt örnekleme (supersampling) ile dört alt ışının ortalaması alınarak boyanır.</p><p><strong>Not:</strong> Yüzey normali yönünde küçük bir epsilon ofseti olmadan gölge ışınları yüzeyin kendisiyle çarpışarak sahte gölge benekleri (shadow acne) üretir.</p></section>
      <section><h2>C Kodunu Satır Satır Tarayıcıya Taşımak: Kurulumsuz Canlı Sahne</h2><p>C ve MiniLibX ile yazılmış bir grafik projesini inceleyen çoğu kişi depoyu klonlayıp derleme zahmetine girmez. Bu engeli kaldırmak için miniRT ve fract-ol projelerindeki matematik çekirdeğini birebir aynı denklem ve sahne dosyalarıyla JavaScript&#39;e port ettim.</p><p>Portfolyonun proje detay sayfasında çalışan canlı simülasyon, depodaki gerçek .rt sahnelerini ayrıştırır; fareyle nesne seçip sürüklediğinizde düşük çözünürlüklü etkileşimli önizleme, bıraktığınızda ise tam 2x2 supersampled kareyi HTML5 Canvas tamponuna çizer.</p></section>
      <hr />
      <section><h2>One Ray Per Pixel: Camera Space to World Space</h2><p>A ray tracer inverts the physical path of light: instead of following millions of photons emitted by a lamp, we cast rays P(t) = O + t·D from the camera origin through each pixel on the viewport plane and ask what surface they hit first.</p><p>In miniRT, scenes are described in plain-text .rt files specifying camera position, orientation vectors, field of view, ambient lighting, point lights, and geometric primitives. The parser validates every coordinate, normal vector, and RGB triplet up front so the renderer only ever operates on well-formed mathematical state.</p></section>
      <section><h2>Analytical Intersections: Spheres, Planes, and Finite Cylinders</h2><p>Sphere and plane intersections are classic closed-form algebra: substituting the ray equation into |O + tD - C|² = r² yields a quadratic equation whose smallest positive root gives the nearest hit distance.</p><p>Finite cylinders are where the geometry gets interesting. You project the ray direction and origin offset perpendicular to the cylinder&#39;s axis to solve for hits against an infinite tube, clip those roots to the [0, height] interval along the axis, and then intersect the ray against the top and bottom circular end-caps—computing radial normals on the curved wall and axial normals on the caps.</p></section>
      <section><h2>Lambertian Diffuse Shading, Shadow Acne, and 2x2 Supersampling</h2><p>Once the closest hit point P and unit surface normal N are known, surface color combines ambient illumination with Lambertian diffuse shading proportional to max(0, N·L), where L points toward the light source.</p><p>To cast hard shadows, a secondary ray is fired from P + εN toward the light. The tiny epsilon offset along the normal is critical: without it, floating-point imprecision causes the shadow ray to re-intersect the originating surface itself, producing speckled shadow acne. Finally, 2x2 supersampling averages four sub-pixel rays per pixel to crisp up object silhouettes.</p></section>
      <section><h2>Porting the C Renderer Line-by-Line to the Browser</h2><p>Because native MiniLibX binaries require a Linux/macOS build environment, I ported both miniRT and fract-ol line-by-line to JavaScript so visitors can run them directly inside the portfolio.</p><p>The interactive playground parses the exact .rt scene files from the C repository, renders an immediate low-resolution pass while you orbit the camera or drag objects, and refines the frame with full 2x2 supersampling the moment pointer movement stops.</p></section>
